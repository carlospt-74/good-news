name: Reconstruir el sitio (build_site.py)

# Disparo: SOLO manual/programático via workflow_dispatch (botón "Run
# workflow" en la pestaña Actions, o GITHUB_CREATE_A_WORKFLOW_DISPATCH_EVENT
# desde una sesión de Claude). A propósito NO se dispara automáticamente con
# push a data/pending/pendiente_*.json: la Fase A del pipeline sube ese
# archivo como borrador varias horas ANTES de que Charly tenga oportunidad
# de aprobar u objetar -- si este workflow se disparara con ese push,
# publicaría el borrador sin aprobación. Por eso la decisión de cuándo
# reconstruir y publicar el sitio le corresponde siempre a una sesión de
# Claude (Fase B, tras confirmar la aprobación) o a un humano, nunca a un
# push automático a esa ruta.
#
# Dos usos:
# 1. Fase B, tras confirmar que Charly aprobó (o no objetó) el borrador de
#    la semana, dispara este workflow con workflow_dispatch. El workflow
#    detecta el pendiente ya aprobado en data/pending/pendiente_*.json, lo
#    usa, hace el commit del sitio regenerado, actualiza la bitácora y
#    borra el pendiente ya procesado -- todo del lado del repo, sin que el
#    HTML generado tenga que pasar por el chat de Claude (eso fue justo lo
#    que causó un incidente de costo el 2026-09-25/26: transcribir HTML
#    grande a mano hacia GitHub).
# 2. Manual (botón "Run workflow" en la pestaña Actions), sin pendiente:
#    reconstruye el sitio con el archivo histórico actual y sin notas
#    nuevas -- sirve para aplicar cambios al script (plantilla, CSS
#    compartido, etc.) a todo el sitio sin necesidad de un lote pendiente.
#
# Nota sobre el commit de este workflow: SIN "[skip ci]" a propósito. Esa
# convención de GitHub cancela TODOS los workflows disparados por ese
# push, no solo este -- si lo llevara, el push a data/site_data.json que
# hace este workflow nunca dispararía a attach-photos.yml, y las notas
# nuevas se quedarían sin foto para siempre, en silencio.
on:
  workflow_dispatch: {}

concurrency:
  group: build-site
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Evita que el propio commit de este workflow (que borra el pendiente
    # procesado, tocando de nuevo data/pending/*.json) se vuelva a
    # disparar a sí mismo en un loop, por si en el futuro se reintrodujera
    # un disparo por push.
    if: github.event.head_commit.author.name != 'buenas-noticias-build-bot'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detectar lote pendiente y/o eliminaciones (si los hay) y reconstruir el sitio
        id: build
        run: |
          PENDIENTE=$(ls data/pending/pendiente_*.json 2>/dev/null | head -n 1 || true)
          if [ -n "$PENDIENTE" ]; then
            echo "Usando lote pendiente: $PENDIENTE"
            echo "pendiente=$PENDIENTE" >> "$GITHUB_OUTPUT"
            REESCRITOS="$PENDIENTE"
          else
            echo "Sin lote pendiente -- reconstrucción de mantenimiento (0 notas nuevas)."
            echo "[]" > /tmp/vacio.json
            REESCRITOS=/tmp/vacio.json
          fi
          ELIMINAR=$(ls data/pending/eliminar_*.json 2>/dev/null | head -n 1 || true)
          ELIMINAR_ARGS=()
          if [ -n "$ELIMINAR" ]; then
            echo "Usando archivo de eliminacion: $ELIMINAR"
            echo "eliminar=$ELIMINAR" >> "$GITHUB_OUTPUT"
            ELIMINAR_ARGS=(--eliminar "$ELIMINAR")
          fi
          python3 scripts/build_site.py --reescritos "$REESCRITOS" "${ELIMINAR_ARGS[@]}" --site-dir . | tee /tmp/build_output.txt
          ADDED=$(grep -oE "Listo: [0-9]+" /tmp/build_output.txt | grep -oE "[0-9]+" || true)
          echo "added=${ADDED:-0}" >> "$GITHUB_OUTPUT"

      - name: Registrar en la bitácora del pipeline
        if: steps.build.outputs.pendiente != '' || steps.build.outputs.eliminar != ''
        run: |
          python3 - <<'PYEOF'
          import json, re
          from datetime import datetime, timezone
          from pathlib import Path

          log_path = Path("data/pipeline_log.json")
          log = json.loads(log_path.read_text(encoding="utf-8")) if log_path.exists() else []

          output = Path("/tmp/build_output.txt").read_text(encoding="utf-8")
          m_added = re.search(r"Listo: (\d+) notas nuevas", output)
          m_total = re.search(r"Total vigente en el sitio: (\d+) notas .* en (\d+) categor", output)
          m_removed = re.search(r"Eliminadas: (\d+) notas", output)
          added = m_added.group(1) if m_added else "?"
          total = m_total.group(1) if m_total else "?"
          categorias = m_total.group(2) if m_total else "?"
          removed_note = f" Eliminadas: {m_removed.group(1)} notas." if m_removed else ""

          log.append({
              "timestamp_utc": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "trigger": "build-site-action",
              "status": "ok",
              "summary": f"Reconstruccion automatica via GitHub Action: {added} notas nuevas agregadas.{removed_note} Total vigente: {total} notas en {categorias} categorias. (Registro mecanico; el resumen cualitativo de aprobacion lo agrega Claude por separado si aplica.)",
          })
          log_path.write_text(json.dumps(log, ensure_ascii=False, indent=2), encoding="utf-8")
          PYEOF

      - name: Regenerar la página de estado
        if: steps.build.outputs.pendiente != '' || steps.build.outputs.eliminar != ''
        run: python3 scripts/build_status_page.py --log data/pipeline_log.json --site-dir .

      - name: Borrar el pendiente ya procesado
        if: steps.build.outputs.pendiente != ''
        run: rm -f "${{ steps.build.outputs.pendiente }}"

      - name: Borrar el archivo de eliminacion ya procesado
        if: steps.build.outputs.eliminar != ''
        run: rm -f "${{ steps.build.outputs.eliminar }}"

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "buenas-noticias-build-bot"
          git config user.email "buenas-noticias-build-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que subir."
          else
            git commit -m "Reconstruye el sitio con build_site.py (via GitHub Action)"
            git push
          fi

      - name: Disparar el workflow de fotos si hubo notas nuevas
        # IMPORTANTE: el push del paso anterior usa el GITHUB_TOKEN por
        # defecto de este mismo workflow, y GitHub bloquea a propósito
        # que ESE push dispare otros workflows (protección anti-loop de
        # la plataforma) -- por eso attach-photos.yml nunca se disparaba
        # solo, aunque su "on: push: paths: data/site_data.json" esté
        # bien configurado. La solución no es tocar ese trigger, sino
        # disparar attach-photos.yml explícitamente aquí, con una llamada
        # directa a la API (que sí funciona con GITHUB_TOKEN, a diferencia
        # de un push implícito).
        if: steps.build.outputs.added != '' && steps.build.outputs.added != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh workflow run attach-photos.yml --ref main; then
            echo "attach-photos.yml disparado correctamente."
          else
            echo "ADVERTENCIA: no se pudo disparar attach-photos.yml automaticamente (revisar permisos de Actions del repo, Settings > Actions > General > Workflow permissions). Dispáralo manualmente desde la pestaña Actions mientras tanto."
          fi
